# 呼び鈴（Cloudflare）を自動で配備する。bell/ 以下が main に入った時、または手動実行で動く
# 必要な GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BELL_SECRET
name: deploy-bell
on:
  push:
    branches: [main]
    paths: ['bell/**', '.github/workflows/deploy-bell.yml']
  workflow_dispatch:
concurrency: deploy-bell
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bell
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx wrangler deploy
      - name: set BELL_SECRET
        run: printf '%s' "$BELL_SECRET" | npx wrangler secret put BELL_SECRET
        env:
          BELL_SECRET: ${{ secrets.BELL_SECRET }}
